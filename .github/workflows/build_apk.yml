name: Build Smart Kids Screen Guard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download & Install Gradle with Auto-Retry
        run: |
          for i in {1..5}; do
            echo "Percobaan $i mengunduh Gradle 8.4..."
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o gradle-8.4-bin.zip https://services.gradle.org/distributions/gradle-8.4-bin.zip; then
              echo "Berhasil mengunduh Gradle."
              break
            fi
            echo "Gagal mengunduh, mencoba lagi dalam 5 detik..."
            sleep 5
          done
          unzip -q gradle-8.4-bin.zip -d /opt
          echo "/opt/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload Compiled APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SmartKidsScreenGuard-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
