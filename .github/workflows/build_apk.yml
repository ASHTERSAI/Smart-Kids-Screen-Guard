name: Build Smart Kids Screen Guard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Auto-Fix Manifest (Hapus Ikon yang Hilang Otomatis)
        run: |
          # Hapus baris roundIcon yang memicu error AAPT
          sed -i '/roundIcon/d' app/src/main/AndroidManifest.xml || true
          # Ganti icon ke ikon bawaan sistem Android
          sed -i 's|@mipmap/ic_launcher|@android:drawable/ic_menu_camera|g' app/src/main/AndroidManifest.xml || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartKidsScreenGuard-APK
          path: app/build/outputs/apk/debug/*.apk
